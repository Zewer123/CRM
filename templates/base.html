<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zewer AML CRM{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-brand">
            <div style="font-size: 28px;">💎</div>
            <div>
                <div class="navbar-title">Zewer AML</div>
                <div class="navbar-subtitle">COMPLIANCE CRM</div>
            </div>
        </div>
        
        <div class="navbar-menu">
            <a href="{{ url_for('dashboard') }}" class="navbar-link">📊 Dashboard</a>
            <a href="{{ url_for('companies') }}" class="navbar-link">🏢 Companies</a>
            <a href="{{ url_for('alerts') }}" class="navbar-link">⚠️ Alerts</a>
            <a href="{{ url_for('reports') }}" class="navbar-link">📈 Reports</a>
            {% if user_role == 'admin' %}
            <a href="{{ url_for('settings') }}" class="navbar-link">⚙️ Settings</a>
            {% endif %}
        </div>
        
        <div class="navbar-right">
            <div class="user-info">
                <div class="user-name">{{ user_name }}</div>
                <div class="user-role">{{ user_role.upper() }}</div>
            </div>
            <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
        </div>
    </nav>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
