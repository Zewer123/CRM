<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zewer AML CRM{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-brand">
            <div style="font-size: 28px;">💎</div>
            <div>
                <div class="navbar-title">Zewer AML</div>
                <div class="navbar-subtitle">COMPLIANCE CRM</div>
            </div>
        </div>
        
        <div class="navbar-menu">
            <a href="{{ url_for('dashboard') }}" class="navbar-link">📊 Dashboard</a>
            <a href="{{ url_for('companies') }}" class="navbar-link">🏢 Companies</a>
            <a href="{{ url_for('alerts') }}" class="navbar-link">⚠️ Alerts</a>
            <a href="{{ url_for('reports') }}" class="navbar-link">📈 Reports</a>
        </div>
        
        <div class="navbar-right">
            <!-- USER DROPDOWN -->
            <div class="user-dropdown">
                <button class="user-btn" onclick="toggleUserMenu()">
                    <div class="user-info">
                        <div class="user-name">{{ user_name }}</div>
                        <div class="user-role">{{ user_role.upper() }}</div>
                    </div>
                    <span style="font-size: 20px;">⚙️</span>
                </button>
                
                <div class="dropdown-menu" id="userMenu" style="display: none;">
                    {% if user_role == 'admin' %}
                    <a href="{{ url_for('settings') }}" class="dropdown-item">⚙️ Settings</a>
                    <a href="{{ url_for('settings') }}" class="dropdown-item">👥 Users</a>
                    <a href="{{ url_for('settings') }}" class="dropdown-item">📋 Dropdowns</a>
                    <div class="dropdown-divider"></div>
                    {% endif %}
                    <a href="{{ url_for('logout') }}" class="dropdown-item logout">🚪 Logout</a>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    
    <script>
        function toggleUserMenu() {
            const menu = document.getElementById('userMenu');
            menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
        }
        
        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            const userDropdown = document.querySelector('.user-dropdown');
            if (!userDropdown.contains(e.target)) {
                document.getElementById('userMenu').style.display = 'none';
            }
        });
    </script>
</body>
</html>
