{% extends "base.html" %}

{% block title %}Add Company - Zewer AML CRM{% endblock %}

{% block content %}
<div class="page-header">
    <h1>➕ Add New Company</h1>
    <p>Enter company compliance details</p>
</div>

<div style="background: white; padding: 30px; border-radius: 8px; border-left: 5px solid #B8956A; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
    <form id="companyForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
        
        <div class="form-group">
            <label>AC Code *</label>
            <input type="text" name="ac_code" required placeholder="Unique code">
        </div>
        
        <div class="form-group">
            <label>Client Name *</label>
            <input type="text" name="client_name" required placeholder="Company name">
        </div>
        
        <div class="form-group">
            <label>Customer Name</label>
            <input type="text" name="customer_name" placeholder="Contact person">
        </div>
        
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="company@example.com">
        </div>
        
        <div class="form-group">
            <label>Mobile</label>
            <input type="tel" name="mobile" placeholder="+971 XX XXX XXXX">
        </div>
        
        <div class="form-group">
            <label>WhatsApp Link</label>
            <input type="url" name="whatsapp" placeholder="https://wa.me/...">
        </div>
        
        <div class="form-group">
            <label>Status</label>
            <select name="ac_status">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Type of Client</label>
            <select name="type_of_client">
                <option value="">Select...</option>
                {% for field, values in dropdown_data.items() %}
                    {% if field == 'TYPE OF CLIENT' %}
                        {% for v in values %}
                        <option value="{{ v }}">{{ v }}</option>
                        {% endfor %}
                    {% endif %}
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label>Region</label>
            <select name="region">
                <option value="">Select...</option>
                {% for field, values in dropdown_data.items() %}
                    {% if field == 'REGION' %}
                        {% for v in values %}
                        <option value="{{ v }}">{{ v }}</option>
                        {% endfor %}
                    {% endif %}
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label>Trade License Number</label>
            <input type="text" name="tl_no" placeholder="TL number">
        </div>
        
        <div class="form-group">
            <label>Trade License Expiry</label>
            <input type="date" name="tl_expiry">
        </div>
        
        <div class="form-group">
            <label>Ejari Expiry</label>
            <input type="date" name="ejari_expiry">
        </div>
        
        <div class="form-group">
            <label>KYC Status</label>
            <select name="kyc">
                <option value="Pending">Pending</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Risk Status</label>
            <select name="risk">
                <option value="Unspecified">Unspecified</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
        </div>
        
        <div style="grid-column: 1 / -1;">
            <div class="form-group">
                <label>Address</label>
                <textarea name="address" placeholder="Full address" rows="3"></textarea>
            </div>
        </div>
    </form>
    
    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn btn-primary" onclick="saveCompany()" style="flex: 1;">💾 Save Company</button>
        <a href="{{ url_for('companies') }}" class="btn btn-danger" style="flex: 1; text-align: center;">← Cancel</a>
    </div>
</div>

<script>
    function saveCompany() {
        const form = document.getElementById('companyForm');
        const data = new FormData(form);
        const obj = {};
        data.forEach((v, k) => obj[k] = v);
        
        fetch('/api/company/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(obj)
        })
        .then(r => r.json())
        .then(d => {
            if (d.success) {
                window.location.href = '/companies';
            } else {
                alert('Error: ' + d.error);
            }
        });
    }
</script>
{% endblock %}
