{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>{% if company %}Edit{% else %}Add New{% endif %} Company</h1>
</div>

<form id="companyForm" style="background: white; padding: 25px; border-radius: 8px;">
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
        <div class="form-group">
            <label>AC Code *</label>
            <input type="text" name="ac_code" required>
        </div>
        <div class="form-group">
            <label>Company Name *</label>
            <input type="text" name="client_name" required>
        </div>
        <div class="form-group">
            <label>Customer Name</label>
            <input type="text" name="customer_name">
        </div>
        
        <div class="form-group">
            <label>Type of Client</label>
            <select name="type_of_client">
                <option value="">Select...</option>
                {% for type in dropdown_data.get('TYPE OF CLIENT', []) %}
                <option>{{ type }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Mode of AC</label>
            <select name="mode_of_ac">
                <option value="">Select...</option>
                {% for mode in dropdown_data.get('MODE OF AC', []) %}
                <option>{{ mode }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Risk Status</label>
            <select name="risk_status">
                <option value="">Select...</option>
                {% for risk in dropdown_data.get('RISK STATUS', []) %}
                <option>{{ risk }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label>Country</label>
            <input type="text" name="country_of_incorporation">
        </div>
        <div class="form-group">
            <label>Region</label>
            <input type="text" name="region">
        </div>
        <div class="form-group">
            <label>Address</label>
            <input type="text" name="address">
        </div>
        
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email_id">
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="telephone" value="+971">
        </div>
        <div class="form-group">
            <label>Mobile</label>
            <input type="tel" name="mobile" value="+971">
        </div>
        
        <div class="form-group">
            <label>Trade License No</label>
            <input type="text" name="trade_license_no">
        </div>
        <div class="form-group">
            <label>Trade License Expiry</label>
            <input type="date" name="trade_license_expiry">
        </div>
        <div class="form-group">
            <label>Address Proof Expiry</label>
            <input type="date" name="address_proof_expiry">
        </div>
    </div>
    
    <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button type="submit" class="btn btn-primary">💾 Save Company</button>
        <a href="{{ url_for('companies') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>

<script>
    document.getElementById('companyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData);
        
        fetch('{{ url_for("api_add_company") }}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(r => r.json()).then(d => {
            if (d.success) {
                window.location.href = '{{ url_for("companies") }}';
            } else {
                alert('Error: ' + d.error);
            }
        });
    });
</script>
{% endblock %}
