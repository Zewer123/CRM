<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zewer AML CRM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2D5F5F 0%, #1a3a3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-logo { font-size: 48px; margin-bottom: 10px; }
        .login-title { font-size: 24px; font-weight: 700; color: #2D5F5F; margin-bottom: 5px; }
        .login-subtitle { font-size: 13px; color: #999; letter-spacing: 1px; }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2D5F5F;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #E0E0E0;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #B8956A;
            box-shadow: 0 0 0 3px rgba(184, 149, 106, 0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #B8956A 0%, #9d7d5c 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(184, 149, 106, 0.3);
        }
        
        .error-message {
            background: #FEE;
            color: #E74C3C;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-size: 13px;
        }
        
        .credentials-hint {
            background: #f0f8ff;
            border-left: 3px solid #B8956A;
            padding: 12px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">💎</div>
            <div class="login-title">Zewer AML</div>
            <div class="login-subtitle">COMPLIANCE CRM</div>
        </div>
        
        <div class="error-message" id="errorMsg"></div>
        
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="admin@zewer.ae" autocomplete="email">
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
        </div>
        
        <button class="login-btn" onclick="login()">🔓 Login</button>
        
        <div class="credentials-hint">
            <strong>Demo Credentials:</strong><br>
            Email: admin@zewer.ae<br>
            Password: Admin@123
        </div>
    </div>
    
    <script>
        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (!email || !password) {
                errorMsg.textContent = 'Please enter email and password';
                errorMsg.style.display = 'block';
                return;
            }
            
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorMsg.textContent = d.error || 'Login failed';
                    errorMsg.style.display = 'block';
                }
            })
            .catch(e => {
                errorMsg.textContent = 'Network error: ' + e.message;
                errorMsg.style.display = 'block';
            });
        }
        
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
