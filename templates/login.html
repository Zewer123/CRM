<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AML CRM - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <!-- Logo / Title -->
            <div class="login-header">
                <h1>AML CRM</h1>
                <p>Anti-Money Laundering Compliance System</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <!-- Remember me checkbox (optional) -->
                <div class="form-group checkbox">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>

                <!-- Error message (hidden until needed) -->
                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <!-- Submit Button -->
                <button type="submit" class="btn-login" id="submitBtn">
                    Login
                </button>
            </form>

            <!-- Temporary Credentials Info -->
            <div class="temp-credentials">
                <h3>🔐 Test Credentials</h3>
                <p><strong>Email:</strong> admin@aml-crm.com</p>
                <p><strong>Password:</strong> TempPass123!</p>
                <small>⚠️ Change these after first login!</small>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <p>&copy; 2024 AML CRM System. All rights reserved.</p>
            </div>
        </div>
    </div>

    <!-- JavaScript for form handling -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
