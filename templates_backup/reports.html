{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>📈 Compliance Reports</h1>
    <p>Generate insights from your data</p>
</div>

<div style="background: white; padding: 25px; border-radius: 8px;">
    <h3 style="color: #2D5F5F; margin-bottom: 20px;">Risk Status Breakdown</h3>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
        {% for risk, count in risk_data %}
        <div style="padding: 20px; background: #f5f5f5; border-radius: 8px; text-align: center;">
            <div style="font-size: 28px; font-weight: 700; color: #2D5F5F;">{{ count }}</div>
            <div style="color: #666; margin-top: 10px;">{{ risk or 'Unspecified' }}</div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
